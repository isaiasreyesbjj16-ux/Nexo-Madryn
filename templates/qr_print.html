<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR de Asistencia - IKIGAI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column;
         align-items: center; justify-content: center; min-height: 100vh;
         background: #fff; color: #111; padding: 20px; text-align: center; }
  h1 { font-size: 36px; margin-bottom: 8px; letter-spacing: 2px; }
  .sub { font-size: 16px; color: #555; margin-bottom: 24px; }
  img { width: 320px; height: 320px; border: 3px solid #111; border-radius: 12px; }
  .inst { margin-top: 24px; font-size: 18px; line-height: 1.6; max-width: 400px; }
  .inst b { color: #d63031; }
  @media print {
    body { padding: 0; }
    .no-print { display: none !important; }
    img { width: 280px; height: 280px; }
  }
</style>
</head>
<body>
  <h1>IKIGAI VIEDMA</h1>
  <p class="sub">Escaneá este código para registrar tu asistencia</p>
  <img src="/qr_print.png" alt="QR de asistencia">
  <div class="inst">
    <p><b>1.</b> Abrí la cámara de tu celular</p>
    <p><b>2.</b> Apuntá al código QR</p>
    <p><b>3.</b> Tocá el enlace que aparece</p>
    <p><b>4.</b> Iniciá sesión y confirmá</p>
  </div>
  <button class="no-print" onclick="window.print()" style="margin-top:24px;padding:12px 24px;font-size:16px;background:#111;color:#fff;border:none;border-radius:8px;cursor:pointer;">
    Imprimir
  </button>
</body>
</html>
